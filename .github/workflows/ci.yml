name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Static repository checks
        run: python3 tools/validate.py
      - name: Release publication guard tests
        run: python3 -m unittest discover -s tools/tests
      - name: Unit tests (no root / power changes)
        run: swift test
      - name: Build and verify app bundle
        env:
          ROA_UNIVERSAL: '1'
        run: ./scripts/build.sh
      - name: CLI smoke checks (no installation)
        run: |
          ./dist/roa version
          ./dist/roa help
          ./scripts/install.sh --dry-run
          for command in 'on --no-wait' 'on --minutes 0' 'on --hours 25' 'on --minutes NaN' 'version extra' 'help extra'; do
            if ./dist/roa $command; then exit 1; else test "$?" = 64; fi
          done
      - name: Upload ad-hoc signed development bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ROA-development-universal
          path: dist/
          retention-days: 7
